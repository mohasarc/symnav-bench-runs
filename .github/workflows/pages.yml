name: deploy study dashboards

on:
  workflow_run:
    workflows: [study batch]
    types: [completed]
  workflow_dispatch:
    inputs:
      results_sha:
        description: Committed results branch revision to deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: results
          fetch-depth: 0
          path: results
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Check out requested results revision
        if: inputs.results_sha != ''
        working-directory: results
        run: git checkout --detach "${{ inputs.results_sha }}"
      - name: Build the static API and study explorer
        run: |
          set -euo pipefail
          python source/scripts/build_site.py \
            results _site source/site source/catalog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
